name: Import eventi

on:
  schedule:
    # Ogni giorno alle 06:17 ora italiana (minuto non tondo: meno ritardi sui runner).
    - cron: "17 6 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo stampa, senza scrivere su Firestore"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-events
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/importer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q tests

      # La cache del geocoding sopravvive tra le esecuzioni: meno richieste a Nominatim.
      - uses: actions/cache@v4
        with:
          path: tools/importer/geocache.json
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-

      - name: Importer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
