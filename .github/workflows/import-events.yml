name: Import eventi

on:
  schedule:
    # Ogni giorno alle 06:17 ora italiana (minuto non tondo: meno ritardi sui runner).
    - cron: "17 6 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo stampa, senza scrivere su Firestore"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-events
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # stima: 30-60 min con ~100 comuni (4 host in parallelo, 1 richiesta/s ciascuno); limite GitHub 6 ore
    defaults:
      run:
        working-directory: tools/importer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q tests

      # Le cache sopravvivono tra le esecuzioni: meno richieste a Nominatim e ai siti dei Comuni
      # (le pagine invariate rispondono 304 grazie a ETag/Last-Modified).
      - uses: actions/cache@v4
        with:
          path: |
            tools/importer/geocache.json
            tools/importer/.httpcache
          key: importer-cache-${{ github.run_id }}
          restore-keys: importer-cache-

      - name: Importer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
