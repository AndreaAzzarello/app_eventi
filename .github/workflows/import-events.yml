# Il titolo "Import eventi" nudo identifica un import completo: lo legge il controllo `guard`.
run-name: Import eventi${{ inputs.dry_run && ' (dry-run)' || '' }}${{ inputs.regione && format(' [{0}]', inputs.regione) || '' }}

on:
  schedule:
    # Terza riserva (10:17 UTC). L'avvio puntuale delle 08:17 UTC (dopo il reset della quota Firestore, che avviene a
    # mezzanotte del Pacifico = 07:00 o 08:00 UTC) è il Cron Trigger del Worker in /scheduler, che chiama workflow_dispatch con
    # auto=true. Il cron di GitHub può ritardare di ore o saltare: chi parte per secondo salta se l'import di oggi c'è già.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo stampa, senza scrivere su Firestore"
        type: boolean
        default: false
      regione:
        description: "Una sola regione (slug, per esempio lombardia); vuoto = tutte quelle con fonti attive"
        type: string
        default: ""
      reconcile:
        description: "Rilegge gli eventi da Firestore ignorando il manifest locale (riconciliazione completa)"
        type: boolean
        default: false
      auto:
        description: "Avvio automatico (Worker /scheduler): salta se l'import completo di oggi è già partito"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: import-events
  cancel-in-progress: false

defaults:
  run:
    working-directory: tools/importer

jobs:
  # Una sola esecuzione completa al giorno: i tre avvii (Worker 08:17, cron GitHub 10:17, lancio manuale con auto) si
  # serializzano con `concurrency` e i successivi trovano quella di oggi. I lanci manuali senza auto non sono controllati.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ github.event_name == 'schedule' || inputs.auto }}
        run: python ci_report.py guard

  plan:
    needs: guard
    if: ${{ needs.guard.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      writes: ${{ steps.matrix.outputs.writes }}
      geocode: ${{ steps.matrix.outputs.geocode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      # Regioni con almeno una fonte attiva e quote per job: le soglie giornaliere si dividono tra i job.
      # Ogni regione si riconcilia con Firestore in un giorno fisso della settimana (ci_report.reconcile_days).
      - id: matrix
        env:
          ONLY: ${{ inputs.regione }}
          RECONCILE: ${{ inputs.reconcile }}
        run: python ci_report.py matrix

  import:
    needs: plan
    runs-on: ubuntu-latest
    # Stima: ~1 s per richiesta e host, 4 fonti in parallelo; Nominatim a 0,25 richieste/s per job (4 job = 1/s in tutto).
    # Limite GitHub per job: 6 ore (360 min); la Lombardia al massimo (1.502 comuni attivi) ne userebbe ~230; sui repository pubblici i minuti dei runner standard sono gratuiti.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      # 4 job in parallelo × 1 richiesta ogni 4 s = 1 richiesta al secondo in tutto verso Nominatim
      NOMINATIM_INTERVAL: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt
      - run: pip install -r requirements.txt
      # Cache per regione: meno richieste a Nominatim e ai siti dei Comuni (le pagine invariate rispondono 304).
      - uses: actions/cache@v4
        with:
          path: |
            tools/importer/geocache.json
            tools/importer/.httpcache
            tools/importer/manifests
          key: importer-${{ matrix.region }}-${{ github.run_id }}
          restore-keys: importer-${{ matrix.region }}-
      - name: Importer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: >
          python run.py --regione ${{ matrix.region }}
          --max-reads ${{ matrix.reads }} --max-writes ${{ needs.plan.outputs.writes }}
          --max-geocode ${{ needs.plan.outputs.geocode }}
          --stats-out stats-${{ matrix.region }}.json
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ (inputs.reconcile || matrix.reconcile) && '--reconcile' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: stats-${{ matrix.region }}
          path: tools/importer/stats-${{ matrix.region }}.json
          if-no-files-found: ignore

  cleanup:
    needs: import
    # Anche se una regione è fallita: la pulizia e il riepilogo servono comunque.
    if: ${{ always() && needs.import.result != 'skipped' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/importer/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pulizia del database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python cleanup.py --stats-out cleanup.json
      - uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: stats
      # Un solo riepilogo: eventi per regione, letture, scritture e cancellazioni rispetto alle quote.
      - name: Riepilogo
        run: python ci_report.py summary stats cleanup.json
