<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Sostituito da `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="L'agenda degli eventi vicino a te: concerti, sagre, mostre e attività per bambini nell'area di Modena.">
  <meta name="theme-color" content="#B8432F" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1110" media="(prefers-color-scheme: dark)">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Eventi Vicini">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Eventi Vicini</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFF8F6; }
    @media (prefers-color-scheme: dark) { html, body { background: #1A1110; } }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.7; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Eventi Vicini"></div>
  <script>
    // Il primo frame di Flutter sostituisce lo splash.
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
