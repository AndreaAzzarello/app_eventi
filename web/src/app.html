<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#B8432F" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1A1412" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script>
			// Tema scelto dall'utente prima del primo paint: niente lampo chiaro/scuro.
			try {
				const t = localStorage.getItem('ev:theme');
				if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t);
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
